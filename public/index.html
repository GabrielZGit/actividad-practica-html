<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html"
            >
                Mi Sitio
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav">

                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="index.html"
                        >
                            Login
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="profile.html"
                        >
                            Perfil
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="tags.html"
                        >
                            Etiquetas
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <div class="container">

        <div class="login-container">

            <div class="card">

                <div class="card-body">

                    <h1 class="text-center mb-5">
                        Iniciar sesión
                    </h1>

                    <form>

                        <div class="mb-4">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                            >

                        </div>


                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
