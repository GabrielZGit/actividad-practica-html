<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">Mi Sitio</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Perfil</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="tags.html">Etiquetas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="formulario.html">
                            Formulario
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>


    <div class="container contenido">

        <div class="card p-4">

            <h1 class="mb-4">Formulario</h1>


            <!-- Radio buttons -->

            <h2 class="h4">Tipo de actividad</h2>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="radio"
                    name="tipoActividad"
                    id="estudiar"
                >
                <label class="form-check-label" for="estudiar">
                    Estudiar
                </label>
            </div>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="radio"
                    name="tipoActividad"
                    id="trabajar"
                >
                <label class="form-check-label" for="trabajar">
                    Trabajar
                </label>
            </div>

            <div class="form-check mb-3">
                <input
                    class="form-check-input"
                    type="radio"
                    name="tipoActividad"
                    id="otro"
                >
                <label class="form-check-label" for="otro">
                    Otro
                </label>
            </div>

            <button
                id="botonRadio"
                class="btn btn-primary mb-5"
                disabled
            >
                Continuar
            </button>


            <!-- País y región -->

            <h2 class="h4">Ubicación</h2>

            <label for="pais" class="form-label">País</label>
            <select id="pais" class="form-select mb-3">
                <option value="">Selecciona un país</option>
            </select>

            <label for="region" class="form-label">Región</label>
            <select id="region" class="form-select mb-5">
                <option value="">Selecciona una región</option>
            </select>


            <!-- Checkboxes -->

            <h2 class="h4">Confirmación</h2>

            <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="checkbox1"
                >
                <label class="form-check-label" for="checkbox1">
                    Confirmo que mis datos son correctos
                </label>
            </div>

            <div class="form-check mb-3">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="checkbox2"
                >
                <label class="form-check-label" for="checkbox2">
                    Acepto los términos
                </label>
            </div>

            <button
                id="botonEnviar"
                class="btn btn-primary"
                disabled
            >
                Enviar
            </button>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="script.js"></script>

</body>

</html>
